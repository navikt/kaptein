name: Sanity Build

on: [pull_request]

jobs:
  sanity-build:
    strategy:
      fail-fast: false
    name: Sanity Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          registries: |
            https://registry.npmjs.org/
            @navikt:https://npm.pkg.github.com/|$BUN_AUTH_TOKEN

      - name: Install dependencies
        shell: bash
        env:
          BUN_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts

      - name: Build
        shell: bash
        run: |
          bun run build

      - name: Typecheck
        shell: bash
        run: |
          bun run typecheck

      - name: Lint
        shell: bash
        run: |
          bun run lint

      - name: Test
        shell: bash
        run: |
          bun test
